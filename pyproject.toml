[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
src_paths = ["tubee", "migrations"]

[tool.poetry]
name = "tubee"
version = "0.14.0"
description = "A Web Application for Monitoring New YouTube Videos"
license = "MIT License"
authors = ["Tomy Hsieh <pypi@tomy.me>"]
readme = "README.md"
homepage = "https://github.com/tomy0000000/Tubee"
repository = "https://github.com/tomy0000000/Tubee"
documentation = "https://github.com/tomy0000000/Tubee/wiki"

[tool.poetry.dependencies]
python = "^3.9.15"
Authlib = "^1.2.0"
Flask = "^2.2.2"
Flask-Bcrypt = "^1.0.1"
Flask-Login = "^0.6.2"
Flask-Migrate = "^4.0.0"
Flask-SQLAlchemy = "^3.0.2"
Flask-WTF = "^1.0.1"
WTForms = "^3.0.1"
Werkzeug = "^2.2.2"
beautifulsoup4 = "^4.11.1"
celery = "^5.2.7"
click = "^8.1.3"
dropbox = "^11.36.0"
google-api-python-client = "^2.70.0"
google-auth = "^2.15.0"
google-auth-oauthlib = "^0.8.0"
gunicorn = "^20.1.0"
lxml = "^4.9.1"
psycopg2 = "^2.9.9"
pushover-complete = "^1.1.1"
python-dateutil = "^2.8.2"
requests = "^2.28.1"
youtube-dl = "^2021.12.17"
sentry-sdk = { extras = ["flask"], version = "^1.5.0" }
loguru = "^0.6.0"

[tool.poetry.group.dev.dependencies]
codecov = "^2.1.13"
coverage = "^6.5.0"
flask-shell-ipython = "^0.4.1"
rope = "^1.6.0"
watchdog = "^2.2.0"
flake8 = "^4.0.1"
black = "^22.6.0"

[tool.pyright]
include = ["tubee"]
exclude = ["**/__pycache__"]
